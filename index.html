<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#131b3a" />
    <script>
      try {
        const saved = localStorage.getItem('macfolio.preferences.v1') ?? localStorage.getItem('hamidos.preferences.v1');
        if (JSON.parse(saved || 'null')?.state?.theme === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#cddfeb';
        }
      } catch { /* Keep the dark default when storage is unavailable. */ }
    </script>
    <meta
      name="description"
      content="Hamid Shaikhy's interactive portfolio. Explore projects, a personal desktop and a little chess."
    />
    <link rel="icon" href="/favicon.svg" />
    <title>macfolio — Hamid Shaikhy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
